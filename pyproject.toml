[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-donation-data"
version = "0.1.0"
description = "Tools for managing, querying, and scraping data from a large donated dataset"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "extruct>=0.17",
    "httpx>=0.27",
    "lxml>=5.2",
    "rich>=13.7",
    "tqdm>=4.66",
]

[project.scripts]
ddd = "data_donation_data.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
